<svg xmlns="http://www.w3.org/2000/svg" width="960" height="430" viewBox="0 0 960 430" role="img" aria-labelledby="title desc">
<title id="title">Um token, dois temas</title><desc id="desc">O token primary aponta para Burnt Orange no tema claro e Electric Blue no tema escuro. O mesmo componente de ação usa a cor correspondente ao tema.</desc>
<rect width="960" height="430" rx="24" fill="#D8CBB3"/>
<text x="32" y="48" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#111111">TOKEN = UMA DECISÃO COM NOME</text>
<text x="32" y="78" font-family="Arial,sans-serif" font-size="15" fill="#111111">A função continua igual. O valor acompanha o tema.</text>
<g transform="translate(24 104)">
<rect width="448" height="300" rx="18" fill="#F3EEE3"/>
<text x="24" y="36" font-family="Arial,sans-serif" font-size="12" fill="#111111">TEMA CLARO</text>
<rect x="24" y="58" width="72" height="72" rx="14" fill="#D9541E"/>
<text x="114" y="83" font-family="Arial,sans-serif" font-size="18" fill="#111111">Burnt Orange</text>
<text x="114" y="111" font-family="monospace" font-size="15" fill="#111111">#D9541E</text>
<text x="24" y="166" font-family="Arial,sans-serif" font-size="14" fill="#111111">Nome da função:</text>
<text x="158" y="166" font-family="monospace" font-size="18" font-weight="700" fill="#111111">--primary</text>
<rect x="24" y="190" width="242" height="54" rx="27" fill="#D9541E"/>
<text x="48" y="224" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#111111">Explorar projetos ↗</text>
<text x="24" y="277" font-family="Arial,sans-serif" font-size="12" fill="#111111">Uso: fundo da ação principal</text></g>
<g transform="translate(488 104)">
<rect width="448" height="300" rx="18" fill="#1E1E1C"/>
<text x="24" y="36" font-family="Arial,sans-serif" font-size="12" fill="#D8CBB3">TEMA ESCURO</text>
<rect x="24" y="58" width="72" height="72" rx="14" fill="#2F6BFF"/>
<text x="114" y="83" font-family="Arial,sans-serif" font-size="18" fill="#D8CBB3">Electric Blue</text>
<text x="114" y="111" font-family="monospace" font-size="15" fill="#D8CBB3">#2F6BFF</text>
<text x="24" y="166" font-family="Arial,sans-serif" font-size="14" fill="#D8CBB3">Nome da função:</text>
<text x="158" y="166" font-family="monospace" font-size="18" font-weight="700" fill="#D8CBB3">--primary</text>
<rect x="24" y="190" width="242" height="54" rx="27" fill="#2F6BFF"/>
<text x="48" y="224" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#FFFFFF">Explorar projetos ↗</text>
<text x="24" y="277" font-family="Arial,sans-serif" font-size="12" fill="#D8CBB3">Uso: fundo da ação principal</text></g>
</svg>